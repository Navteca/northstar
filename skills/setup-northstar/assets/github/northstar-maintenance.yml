name: Northstar maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1"

permissions:
  contents: write

concurrency:
  group: northstar-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Archive and regenerate views
        run: |
          ADMIN="$(find . -path '*/northstar/scripts/northstar_admin.py' -print -quit)"
          test -n "$ADMIN"
          python3 "$ADMIN" archive --apply
          python3 "$ADMIN" render
      - name: Commit generated maintenance changes
        run: |
          git config user.name northstar-bot
          git config user.email northstar-bot@users.noreply.github.com
          git add -- ROADMAP.md roadmap/archive roadmap/views roadmap/dashboard.html
          git diff --cached --quiet && exit 0
          git commit -m "northstar: archive completed work and refresh views"
          git push
