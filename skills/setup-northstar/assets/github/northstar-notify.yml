name: Northstar notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: northstar-notifications
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      NORTHSTAR_WEBHOOK_URL: ${{ secrets.NORTHSTAR_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.NORTHSTAR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deliver pending lifecycle events
        run: python3 roadmap/bin/northstar_admin.py notify
      - name: Persist delivery cursor
        run: |
          git config user.name northstar-bot
          git config user.email northstar-bot@users.noreply.github.com
          git add -- roadmap/.notification-cursor
          git diff --cached --quiet && exit 0
          git commit -m "northstar: advance notification cursor"
          git push
