name: Northstar claim

on:
  workflow_dispatch:
    inputs:
      item:
        description: Roadmap ID, for example RM-024
        required: true
      owner:
        description: Stable Northstar teammate name
        required: true
      branch:
        description: Target implementation branch
        required: true
      execution_method:
        description: Native or RPI
        required: true
        default: Native

permissions:
  contents: write

concurrency:
  group: northstar-${{ inputs.item }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Claim from canonical branch
        env:
          ITEM: ${{ inputs.item }}
          OWNER: ${{ inputs.owner }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXECUTION_METHOD: ${{ inputs.execution_method }}
        run: |
          ENGINE="$(find . -path '*/northstar/scripts/northstar.py' -print -quit)"
          test -n "$ENGINE"
          python3 "$ENGINE" pickup "$ITEM" --owner "$OWNER" --actor "$OWNER" --branch "$TARGET_BRANCH" --execution-method "$EXECUTION_METHOD" --local-only --apply
          python3 "$ENGINE" validate
          git config user.name northstar-bot
          git config user.email northstar-bot@users.noreply.github.com
          git add -- ROADMAP.md roadmap/items roadmap/audit.md roadmap/audit.chain.jsonl
          git commit -m "northstar: claim $ITEM for $OWNER"
          git push
