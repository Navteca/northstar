name: Northstar claim

# Serialized server-side pickup. The claimant is the person who dispatches the workflow:
# github.actor is resolved to a roadmap teammate through [identities] in roadmap/northstar.toml,
# so nobody can claim an item on someone else's behalf.
on:
  workflow_dispatch:
    inputs:
      item:
        description: Roadmap ID, for example RM-024
        required: true
      branch:
        description: Target implementation branch
        required: true
      execution_method:
        description: Native or RPI
        required: true
        default: Native

permissions:
  contents: write

concurrency:
  group: northstar-${{ inputs.item }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          # If the default branch is protected, replace GITHUB_TOKEN with a token that may bypass protection for roadmap paths.
          token: ${{ secrets.NORTHSTAR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Claim from canonical branch
        env:
          ITEM: ${{ inputs.item }}
          LOGIN: ${{ github.actor }}
          TARGET_BRANCH: ${{ inputs.branch }}
          EXECUTION_METHOD: ${{ inputs.execution_method }}
        run: |
          python3 roadmap/bin/northstar.py pickup "$ITEM" --owner-login "$LOGIN" --branch "$TARGET_BRANCH" --execution-method "$EXECUTION_METHOD" --local-only --apply
          python3 roadmap/bin/northstar.py validate
          git config user.name northstar-bot
          git config user.email northstar-bot@users.noreply.github.com
          git add -- ROADMAP.md roadmap/items roadmap/audit.md roadmap/audit.chain.jsonl roadmap/journal
          git commit -m "northstar: claim $ITEM for $LOGIN"
          git push
